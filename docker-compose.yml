version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: careerhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerhub
      POSTGRES_PASSWORD: careerhub_password
      POSTGRES_DB: careerhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  proctoring:
    build:
      context: ./services/proctoring
      dockerfile: Dockerfile
    container_name: careerhub-proctoring
    restart: unless-stopped
    ports:
      - "8000:7860"
    environment:
      - INTERVIEW_ML_TOKEN=careerhub-ml-secret-token-2026-auth-secure
      - PORT=7860

  livekit:
    image: livekit/livekit-server:latest
    container_name: careerhub-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - 'LIVEKIT_KEYS=devkey: secret'

volumes:
  postgres_data: