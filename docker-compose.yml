version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: careerhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerhub
      POSTGRES_PASSWORD: careerhub_password
      POSTGRES_DB: careerhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerhub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: