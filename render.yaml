services:
  - type: web
    name: careerhub-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api && npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
    startCommand: npm run start --workspace=@careerhub/api
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: PISTON_API_URL
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
