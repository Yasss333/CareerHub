services:
  - type: web
    name: careerhub-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api && npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/prisma/seed.js
    startCommand: npm run start --workspace=@careerhub/api
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "https://careerhub-navy.vercel.app,http://localhost:5173"
      - key: PISTON_API_URL
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: INTERVIEW_ML_URL
        sync: false
      - key: INTERVIEW_ML_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MODEL_NAME
        value: openai/gpt-4o-mini
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

